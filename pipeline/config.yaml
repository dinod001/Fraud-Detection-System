data_paths:
  raw_fraud_data: "data/raw/Fraud_Data.csv"
  raw_ip_country: "data/raw/IpAddress_to_Country.csv"
  processed_data: "data/processed/feature_engineered.csv"
  artifacts_dir: "artifacts"
  model_artifacts_dir: "artifacts/models"
  scaler_artifacts: "artifacts/scaler/scaler.joblib"
  target_encoding_artifacts: "artifacts/encodings/target_mappings.joblib"
  X_train: "artifacts/X_train.csv"
  X_test: "artifacts/X_test.csv"
  y_train: "artifacts/y_train.csv"
  y_test: "artifacts/y_test.csv"

columns:
  target: "class"
  drop_columns:
    - "user_id"
    - "signup_time"
    - "purchase_time"
    - "device_id"
    - "ip_address"
    - "ip_address_int"
    - "lower_bound_ip_address"
    - "upper_bound_ip_address"
    - "browser"
    - "source"
    - "country"
    - "sex"
  categorical_columns:
    - "browser"
    - "source"
    - "country"
  features_to_scale:
    - "purchase_value"
    - "age"
    - "account_age_minutes"
    - "purchase_hour"
    - "purchase_day_of_week"
    - "is_weekend"
    - "is_night"
    - "device_txn_count_total"
    - "is_device_new"
    - "purchase_value_log"
    - "purchase_value_zscore"
    - "is_outlier_amount"
    - "browser_fraud_rate"
    - "source_fraud_rate"
    - "country_fraud_rate"

business_cost:
  false_negative_cost: 100
  false_positive_cost: 5

training:
  random_state: 42
  test_size: 0.2
  cv_folds: 3

models:
  xgboost:
    param_grid:
      learning_rate: [0.01, 0.1]
      max_depth: [4, 6, 8]
      n_estimators: [100, 200]
    optimal_threshold: 0.38
    model_path: "artifacts/models/xgb_final_model.joblib"
  
  random_forest:
    param_grid:
      max_depth: [10, 20, 15]
      min_samples_split: [2, 5]
      n_estimators: [100, 200]
      class_weight: ['balanced_subsample']
    optimal_threshold: 0.09
    model_path: "artifacts/models/xgb_final_model.joblib"

mlflow:
  tracking_uri: "file:./mlruns"  # Local file-based tracking
  experiment_name: "Fraud Detection System"
  model_registry_name: "Fraud_Detection"
  artifact_path: "model"
  run_name_prefix: "fraud_run"
  tags:
    project: "Fraud Detection System"
    team: "ml_engineering"
    environment: "development"
  autolog: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "fraud_pipeline.log"